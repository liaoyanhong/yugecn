<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📚 艾宾浩斯记忆背单词 - 每日30词</title>
    <style>
        :root {
            --bg: #f8f9fa;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --subtext: #5a6c7d;
            --accent: #4a90d9;
            --accent-dark: #357abd;
            --gold: #f0a500;
            --new-badge: #27ae60;
            --review-badge: #e67e22;
            --master-bg: #f0c040;
            --master-text: #7a5c10;
            --border: #e0e5ec;
            --shadow: 0 2px 12px rgba(0,0,0,0.06);
            --shadow-lg: 0 8px 30px rgba(0,0,0,0.1);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4,0,0.2,1);
            --font-mono: 'SF Mono','Cascadia Code','Consolas','Monaco',monospace;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
            background: var(--bg); color: var(--text); line-height:1.6;
            min-height:100vh; -webkit-tap-highlight-color:transparent; -webkit-font-smoothing:antialiased;
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }
        .container { max-width:520px; margin:0 auto; padding:12px 14px 30px; }
        .header {
            text-align:center; padding:18px 0 8px; position:sticky; top:0; z-index:10;
            background:var(--bg); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
        }
        .header .logo { font-size:2rem; margin-bottom:2px; }
        .header h1 { font-size:1.4rem; font-weight:700; letter-spacing:-0.02em; color:var(--text); }
        .header .subtitle { font-size:0.8rem; color:var(--subtext); margin-top:-2px; }
        .date-display {
            text-align:center; font-size:0.95rem; font-weight:600; color:var(--accent);
            margin:6px 0 10px; padding:8px 16px; background:#eef5fc; border-radius:20px;
            display:inline-block; width:100%; letter-spacing:0.02em;
        }
        .level-selector { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin:10px 0 14px; }
        .level-btn {
            padding:10px 18px; border-radius:25px; border:2px solid var(--border);
            background:var(--card-bg); font-size:0.9rem; font-weight:600; cursor:pointer;
            transition:var(--transition); color:var(--subtext); white-space:nowrap;
            letter-spacing:0.02em; -webkit-tap-highlight-color:transparent; user-select:none;
        }
        .level-btn:active { transform:scale(0.96); }
        .level-btn.active {
            border-color:var(--accent); background:#eef5fc; color:var(--accent);
            font-weight:700; box-shadow:0 0 0 3px rgba(74,144,217,0.1);
        }
        .stats-bar { display:flex; gap:8px; justify-content:center; flex-wrap:wrap; margin-bottom:14px; }
        .stat-chip {
            padding:7px 14px; border-radius:20px; font-size:0.78rem; font-weight:600;
            letter-spacing:0.02em; display:flex; align-items:center; gap:5px;
        }
        .stat-new { background:#e8f8ef; color:#1a7a42; }
        .stat-review { background:#fef5ec; color:#b8601f; }
        .stat-total { background:#eef2f7; color:#4a5568; }
        .stat-dot { width:8px; height:8px; border-radius:50%; display:inline-block; }
        .stat-dot.new { background:#27ae60; }
        .stat-dot.review { background:#e67e22; }
        .section-title {
            font-size:1rem; font-weight:700; margin:16px 0 10px; padding-left:4px;
            display:flex; align-items:center; gap:6px; letter-spacing:0.02em;
        }
        .word-card {
            background:var(--card-bg); border-radius:var(--radius); padding:14px 16px;
            margin-bottom:10px; box-shadow:var(--shadow); border-left:4px solid transparent;
            transition:var(--transition); position:relative; overflow:hidden;
        }
        .word-card.new-word { border-left-color:var(--new-badge); }
        .word-card.review-word { border-left-color:var(--review-badge); }
        .word-card:active { transform:scale(0.985); box-shadow:var(--shadow-lg); }
        .word-card .word-row { display:flex; align-items:baseline; flex-wrap:wrap; gap:8px; margin-bottom:4px; }
        .word-card .word {
            font-size:1.15rem; font-weight:700; color:var(--text); letter-spacing:-0.01em;
            font-family:var(--font-mono); background:#f7f9fb; padding:3px 10px; border-radius:6px;
        }
        .word-card .phonetic { font-size:0.78rem; color:#888; font-family:var(--font-mono); }
        .word-card .meaning { font-size:0.9rem; color:#e65100; font-weight:600; margin-bottom:4px; padding:2px 0; }
        .word-card .example {
            font-size:0.82rem; color:#555; font-style:italic; padding:6px 10px;
            background:#fafbfc; border-radius:8px; margin-top:4px; line-height:1.5;
            border:1px solid #f0f2f5;
        }
        .word-card .example .highlight {
            font-weight:700; color:#2c3e50; font-style:normal;
            background:#fff3cd; padding:1px 4px; border-radius:3px;
        }
        .recall-content { margin-top:8px; }
        .recall-content.is-hidden { display:none; }
        .recall-actions { display:flex; gap:6px; flex-wrap:wrap; margin-top:10px; padding-right:74px; }
        .recall-btn,.rating-btn,.word-tool-btn {
            border:1px solid var(--border); background:#fff; color:var(--subtext); border-radius:16px;
            padding:6px 11px; font-size:0.72rem; font-weight:700; cursor:pointer; transition:var(--transition);
        }
        .recall-btn { color:var(--accent); border-color:#b9d4ef; background:#f3f8fd; }
        .rating-btn[data-rating="again"] { color:#c0392b; background:#fff2f0; border-color:#efc4be; }
        .rating-btn[data-rating="hard"] { color:#b8601f; background:#fff7e8; border-color:#f0d09d; }
        .rating-btn[data-rating="good"] { color:#1a7a42; background:#edf9f1; border-color:#b9e1c7; }
        .word-tool-btn { padding:4px 8px; font-size:0.68rem; }
        .word-card.is-answered { background:#fbfffc; box-shadow:0 0 0 2px rgba(39,174,96,0.12),var(--shadow); }
        .answer-mark { color:#1a7a42; font-size:0.72rem; font-weight:700; }
        .word-card .tag {
            position:absolute; top:10px; right:12px; font-size:0.68rem; font-weight:700;
            padding:3px 10px; border-radius:12px; letter-spacing:0.03em;
        }
        .tag.new-tag { background:#e8f8ef; color:#1a7a42; }
        .tag.review-tag { background:#fef5ec; color:#b8601f; }
        .master-btn {
            position:absolute; bottom:10px; right:12px; padding:4px 12px;
            border-radius:15px; border:1px solid #e0c050; background:#fffbe6;
            color:#7a5c10; font-size:0.7rem; font-weight:700; cursor:pointer;
            transition:var(--transition); -webkit-tap-highlight-color:transparent;
            letter-spacing:0.02em; z-index:2;
        }
        .master-btn:active { transform:scale(0.9); background:#f0c040; color:#fff; border-color:#c09830; }
        .story-card {
            background:linear-gradient(135deg,#fffbeb 0%,#fff7e0 50%,#fef9f0 100%);
            border-radius:var(--radius); padding:18px 16px; margin-top:10px;
            box-shadow:var(--shadow-lg); border:2px solid #f0d78c; position:relative; overflow:hidden;
        }
        .story-card::before {
            content:'📖'; position:absolute; top:-15px; right:-5px; font-size:3.5rem;
            opacity:0.12; transform:rotate(15deg);
        }
        .story-card h3 {
            font-size:1rem; font-weight:700; margin-bottom:10px; color:#8b6914;
            letter-spacing:0.02em; position:relative; z-index:1;
        }
        .story-card .story-en {
            font-size:0.88rem; color:#4a3728; line-height:1.8; margin-bottom:14px;
            padding:10px 12px; background:rgba(255,255,255,0.7); border-radius:10px;
            position:relative; z-index:1; letter-spacing:0.01em;
        }
        .story-card .story-en .story-word {
            font-weight:700; color:#c0392b; background:#fff3cd; padding:2px 5px;
            border-radius:4px; font-family:var(--font-mono); font-size:0.85rem;
        }
        .story-card .divider { border:none; border-top:1px dashed #d4b87a; margin:10px 0; position:relative; z-index:1; }
        .story-card .story-cn {
            font-size:0.84rem; color:#5d4e37; line-height:1.8; padding:10px 12px;
            background:rgba(255,255,255,0.6); border-radius:10px; position:relative;
            z-index:1; letter-spacing:0.02em;
        }
        .story-card .story-cn .story-word-cn {
            font-weight:700; color:#8b4513; background:#fff3cd; padding:1px 4px; border-radius:3px;
        }
        .action-row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:18px; }
        .btn {
            padding:11px 22px; border-radius:25px; border:none; font-size:0.9rem;
            font-weight:600; cursor:pointer; transition:var(--transition); letter-spacing:0.02em;
            -webkit-tap-highlight-color:transparent; user-select:none; display:flex; align-items:center; gap:6px;
        }
        .btn:active { transform:scale(0.95); }
        .btn-primary { background:var(--accent); color:#fff; box-shadow:0 4px 14px rgba(74,144,217,0.3); }
        .btn-outline { background:var(--card-bg); color:var(--accent); border:2px solid var(--accent); }
        .btn-small { padding:6px 14px; font-size:0.75rem; border-radius:18px; }
        .btn-danger { background:#fff; color:#c0392b; border:2px solid #e0c8c4; }
        .btn-success { background:#27ae60; color:#fff; border:2px solid #27ae60; }
        .punch-info {
            display:flex; align-items:center; gap:8px; justify-content:center;
            margin:10px 0; font-weight:600; color:#2c3e50;
        }
        .punch-badge { background:#fef5ec; padding:6px 15px; border-radius:20px; font-size:0.9rem; }
        .toast {
            position:fixed; top:20px; left:50%; transform:translateX(-50%) translateY(-120px);
            background:#333; color:#fff; padding:10px 22px; border-radius:25px;
            font-size:0.85rem; font-weight:600; z-index:999;
            transition:transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275); pointer-events:none;
        }
        .toast.show { transform:translateX(-50%) translateY(0); }
        .progress-wrap { margin:8px 0; }
        .progress-bar { height:6px; background:#e9ecef; border-radius:3px; overflow:hidden; }
        .progress-fill {
            height:100%; background:linear-gradient(90deg,#27ae60,#2ecc71);
            border-radius:3px; transition:width 0.5s ease;
        }
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(16px); }
            to { opacity:1; transform:translateY(0); }
        }
        .word-card,.story-card { animation:fadeInUp 0.4s ease forwards; }
        .empty-state { text-align:center; padding:30px; color:#999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">📚</div>
        <h1>艾宾浩斯背单词</h1>
        <p class="subtitle">每日30词 · 科学记忆 · 故事巩固</p>
    </div>
    <div class="level-selector" id="levelSelector">
        <button class="level-btn active" data-level="cet4">🎓 四级</button>
        <button class="level-btn" data-level="cet6">📖 六级</button>
        <button class="level-btn" data-level="tem8">🏆 八级</button>
    </div>
    <div class="date-display" id="dateDisplay">📅 加载中...</div>
    <div class="stats-bar" id="statsBar">
        <span class="stat-chip stat-new"><span class="stat-dot new"></span> 新词: <strong id="newCount">15</strong></span>
        <span class="stat-chip stat-review"><span class="stat-dot review"></span> 复习: <strong id="reviewCount">15</strong></span>
        <span class="stat-chip stat-total">📊 已学: <strong id="totalLearned">0</strong></span>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%;"></div></div>
        <small style="color:#888;font-size:0.7rem;" id="progressLabel">今日进度: 0/30</small>
    </div>
    <div class="punch-info">
        <span class="punch-badge">🏆 累计打卡 <strong id="punchDays">0</strong> 天</span>
    </div>
    <div class="action-row">
        <button class="btn btn-primary" id="btnRefresh">🔄 刷新今日单词</button>
        <button class="btn btn-success" id="btnPunch">📌 今日打卡</button>
        <button class="btn btn-outline btn-small" id="btnExport">⬇️ 导出数据</button>
        <button class="btn btn-outline btn-small" id="btnImport">⬆️ 导入数据</button>
        <button class="btn btn-danger btn-small" id="btnReset">🗑️ 重置进度</button>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
    </div>
    <div class="section-title"><span class="emoji">🆕</span> 今日新词 (<span id="newSectionCount">0</span>个)</div>
    <div id="newWordsContainer"></div>
    <div class="section-title"><span class="emoji">🔄</span> 今日复习 (<span id="reviewSectionCount">0</span>个 · 艾宾浩斯曲线)</div>
    <div id="reviewWordsContainer"></div>
    <div class="section-title"><span class="emoji">📖</span> 巩固记忆 · 英文故事</div>
    <div id="storyContainer"></div>
</div>
<div class="toast" id="toast"></div>

<script>
    (function() {
        const VOCABULARY = {
            cet4: [
                { word: "abandon", phonetic: "/əˈbændən/", meaning: "v. 放弃；抛弃", example: "He decided to abandon his old habits and start fresh.", exampleCn: "他决定放弃旧习惯，重新开始。" },
                { word: "ability", phonetic: "/əˈbɪləti/", meaning: "n. 能力；才能", example: "She has the ability to solve complex problems quickly.", exampleCn: "她有能力快速解决复杂问题。" },
                { word: "absence", phonetic: "/ˈæbsəns/", meaning: "n. 缺席；不在", example: "His absence from the meeting was noted by everyone.", exampleCn: "他缺席会议被每个人都注意到了。" },
                { word: "absolute", phonetic: "/ˈæbsəluːt/", meaning: "adj. 绝对的；完全的", example: "You need absolute concentration for this task.", exampleCn: "你需要绝对的专注来完成这个任务。" },
                { word: "absorb", phonetic: "/əbˈzɔːrb/", meaning: "v. 吸收；吸引", example: "Plants absorb sunlight to produce energy.", exampleCn: "植物吸收阳光来产生能量。" },
                { word: "abstract", phonetic: "/ˈæbstrækt/", meaning: "adj. 抽象的 n. 摘要", example: "The concept is too abstract for beginners to understand.", exampleCn: "这个概念对初学者来说太抽象了。" },
                { word: "abundant", phonetic: "/əˈbʌndənt/", meaning: "adj. 丰富的；充裕的", example: "The region has abundant natural resources.", exampleCn: "该地区拥有丰富的自然资源。" },
                { word: "academic", phonetic: "/ˌækəˈdemɪk/", meaning: "adj. 学术的；学院的", example: "She published several academic papers this year.", exampleCn: "她今年发表了几篇学术论文。" },
                { word: "accelerate", phonetic: "/əkˈseləreɪt/", meaning: "v. 加速；加快", example: "The car can accelerate from 0 to 100 in just 5 seconds.", exampleCn: "这辆车能在5秒内从0加速到100。" },
                { word: "accomplish", phonetic: "/əˈkɑːmplɪʃ/", meaning: "v. 完成；实现", example: "We need to accomplish this project by Friday.", exampleCn: "我们需要在周五前完成这个项目。" },
                { word: "accurate", phonetic: "/ˈækjərət/", meaning: "adj. 准确的；精确的", example: "The weather forecast proved to be accurate.", exampleCn: "天气预报被证明是准确的。" },
                { word: "achieve", phonetic: "/əˈtʃiːv/", meaning: "v. 达到；取得", example: "She worked hard to achieve her career goals.", exampleCn: "她努力实现自己的职业目标。" },
                { word: "acknowledge", phonetic: "/əkˈnɑːlɪdʒ/", meaning: "v. 承认；感谢", example: "He acknowledged his mistake and apologized.", exampleCn: "他承认了自己的错误并道了歉。" },
                { word: "adapt", phonetic: "/əˈdæpt/", meaning: "v. 适应；改编", example: "Animals must adapt to changing environments.", exampleCn: "动物必须适应不断变化的环境。" },
                { word: "adequate", phonetic: "/ˈædɪkwət/", meaning: "adj. 足够的；适当的", example: "We need adequate preparation before the exam.", exampleCn: "考试前我们需要充分的准备。" },
                { word: "benefit", phonetic: "/ˈbenɪfɪt/", meaning: "n. 益处 v. 受益", example: "Regular exercise can benefit both body and mind.", exampleCn: "规律运动能使身心受益。" },
                { word: "challenge", phonetic: "/ˈtʃælɪndʒ/", meaning: "n. 挑战 v. 向…挑战", example: "The team accepted the challenge with confidence.", exampleCn: "团队满怀信心地接受了挑战。" },
                { word: "create", phonetic: "/kriˈeɪt/", meaning: "v. 创造；创建", example: "Good questions create opportunities for learning.", exampleCn: "好问题能创造学习机会。" },
                { word: "decide", phonetic: "/dɪˈsaɪd/", meaning: "v. 决定；判定", example: "We must decide which plan is most practical.", exampleCn: "我们必须决定哪个方案最实际。" },
                { word: "develop", phonetic: "/dɪˈveləp/", meaning: "v. 发展；开发", example: "Students develop confidence through practice.", exampleCn: "学生通过练习培养信心。" },
                { word: "energy", phonetic: "/ˈenərdʒi/", meaning: "n. 能量；精力", example: "Solar panels turn sunlight into energy.", exampleCn: "太阳能板把阳光转化为能量。" },
                { word: "environment", phonetic: "/ɪnˈvaɪrənmənt/", meaning: "n. 环境；周围状况", example: "A quiet environment helps people concentrate.", exampleCn: "安静的环境有助于人们集中注意力。" },
                { word: "improve", phonetic: "/ɪmˈpruːv/", meaning: "v. 改善；提高", example: "Feedback can improve the quality of our work.", exampleCn: "反馈可以提高我们的工作质量。" },
                { word: "knowledge", phonetic: "/ˈnɑːlɪdʒ/", meaning: "n. 知识；了解", example: "Experience turns knowledge into good judgment.", exampleCn: "经验能把知识转化为良好的判断力。" },
                { word: "method", phonetic: "/ˈmeθəd/", meaning: "n. 方法；办法", example: "This method makes difficult ideas easier to remember.", exampleCn: "这种方法让困难的概念更容易记住。" },
                { word: "opportunity", phonetic: "/ˌɑːpərˈtuːnəti/", meaning: "n. 机会；时机", example: "Every mistake is an opportunity to learn.", exampleCn: "每个错误都是学习的机会。" },
                { word: "project", phonetic: "/ˈprɑːdʒekt/", meaning: "n. 项目；计划", example: "The community project brought neighbors together.", exampleCn: "社区项目让邻里走到了一起。" },

            cet6: [

                { word: "abide", phonetic: "/əˈbaɪd/", meaning: "v. 遵守；忍受", example: "All citizens must abide by the law.", exampleCn: "所有公民都必须遵守法律。" },
                { word: "advocate", phonetic: "/ˈædvəkeɪt/", meaning: "v. 提倡 n. 支持者", example: "Many doctors advocate regular health checks.", exampleCn: "许多医生提倡定期体检。" },

                { word: "ambiguous", phonetic: "/æmˈbɪɡjuəs/", meaning: "adj. 模棱两可的；含糊的", example: "The ambiguous instruction confused the whole team.", exampleCn: "含糊的指示让整个团队困惑。" },
                { word: "analogy", phonetic: "/əˈnælədʒi/", meaning: "n. 类比；比拟", example: "The teacher used an analogy to explain the system.", exampleCn: "老师用类比解释这个系统。" },
                { word: "anticipate", phonetic: "/ænˈtɪsɪpeɪt/", meaning: "v. 预期；预料", example: "We anticipate strong demand next year.", exampleCn: "我们预计明年需求强劲。" },

        function getDefaultData() {
            return { schemaVersion: 4, level: 'cet4', newWordIndex: 0, dailyWords: {}, wordRecords: {} };
        }

        function migrateData(source) {
            const data = Object.assign(getDefaultData(), source || {});
            const migratedDays = {};
            Object.entries(data.dailyWords || {}).forEach(([key, entry]) => {
                const targetKey = key.includes('::') ? key : `${key}::${entry.level || data.level || 'cet4'}`;
                migratedDays[targetKey] = { responses: {}, ...entry };
            });
            data.dailyWords = migratedDays;
            Object.values(data.wordRecords || {}).forEach(record => {
                record.stability = Math.max(1, Number(record.stability) || Math.max(1, record.reviewsCompleted || 1));
                record.lapseCount = Number(record.lapseCount) || 0;
                if (!record.dueDate) {
                    const pending = (record.reviewSchedule || []).find(date => date >= TODAY);
                    record.dueDate = pending || getDateAfterDays(record.lastReviewedDate || record.learnDate || TODAY, 1);
                }
            });
            data.schemaVersion = 4;
            return data;
        }

        function loadData() {
            try {
                const raw = localStorage.getItem(STORAGE_KEY) || LEGACY_STORAGE_KEYS.map(k=>localStorage.getItem(k)).find(Boolean);

            } catch(e) {}
            return getDefaultData();
        }
        function saveData(data) {
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

        }
        let appData = loadData();

        function formatLocalDate(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function getDateAfterDays(dateStr, days) {
            const [year, month, day] = dateStr.split('-').map(Number);
            const date = new Date(year, month - 1, day);
            date.setDate(date.getDate() + days);
            return formatLocalDate(date);
        }
        function getWordKey(level, word) { return level + '::' + word; }
        function getDailyKey(date=TODAY, level=appData.level) { return `${date}::${level}`; }
        function getLevelVocab(level) { return VOCABULARY[level] || VOCABULARY['cet4']; }
        function generateReviewSchedule(learnDate) { return EBBINGHAUS_INTERVALS.map(i => getDateAfterDays(learnDate, i)); }

        function scheduleByRating(record, rating) {
            const current = Math.max(1, Number(record.stability) || 1);
            let interval;
            if (rating === 'again') {
                record.stability = Math.max(1, current * 0.55);
                record.lapseCount = (record.lapseCount || 0) + 1;
                interval = 1;
            } else if (rating === 'hard') {
                record.stability = Math.max(2, current * 1.45);
                interval = Math.max(2, Math.round(record.stability));
            } else {
                record.stability = Math.max(3, current * 2.35);
                interval = Math.max(3, Math.round(record.stability));
            }
            record.reviewsCompleted = (record.reviewsCompleted || 0) + 1;
            record.lastReviewedDate = TODAY;
            record.lastRating = rating;
            record.dueDate = getDateAfterDays(TODAY, interval);
            record.reviewSchedule = [record.dueDate];
            return interval;
        }

        function hashString(text) {
            let hash = 2166136261;
            for (let i = 0; i < text.length; i++) {
                hash ^= text.charCodeAt(i);
                hash = Math.imul(hash, 16777619);
            }
            return hash >>> 0;
        }

        function seededRandom(seed) {
            return function() {
                seed |= 0;
                seed = seed + 0x6D2B79F5 | 0;
                let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        // 同一天刷新页面顺序不跳动，不同日期和等级会得到不同的乱序结果。
        function shuffleForDay(items, salt) {
            const result = [...items].sort((a, b) => {
                const aKey = a.word || a.key || JSON.stringify(a);
                const bKey = b.word || b.key || JSON.stringify(b);
                return aKey.localeCompare(bKey);
            });
            const random = seededRandom(hashString(`${TODAY}|${salt}`));
            for (let i = result.length - 1; i > 0; i--) {
                const j = Math.floor(random() * (i + 1));
                [result[i], result[j]] = [result[j], result[i]];
            }
            return result;
        }

        function getTodayWords(data, level) {
            const today = TODAY;
            const dayKey = getDailyKey(today, level);
            const vocab = getLevelVocab(level);
            if (data.dailyWords[dayKey]?.level === level) {
                const cached = data.dailyWords[dayKey];
                cached.responses = cached.responses || {};
                cached.newWords = shuffleForDay(cached.newWords || [], `${level}:cached-new`);
                cached.reviewWords = shuffleForDay(cached.reviewWords || [], `${level}:cached-review`);
                if (cached.storyVersion !== STORY_VERSION) {
                    const storyResult = generateStory([...cached.newWords, ...cached.reviewWords], level);
                    cached.story = storyResult.storyEn;
                    cached.storyCn = storyResult.storyCn;
                    cached.storyVersion = STORY_VERSION;
                    saveData(data);
                }
                return cached;
            }

            const allReviewCandidates = [];
            for (const [key, record] of Object.entries(data.wordRecords)) {
                if (!key.startsWith(level+'::') || record.mastered) continue;
                const isDue = record.dueDate ? record.dueDate <= today : record.reviewSchedule?.some(date=>date<=today);
                if (isDue && record.lastReviewedDate !== today) {
                    allReviewCandidates.push({ key, word: key.split('::')[1], record, urgency: record.reviewsCompleted||0 });
                }
            }
            allReviewCandidates.sort((a,b)=>a.urgency-b.urgency || new Date(a.record.learnDate)-new Date(b.record.learnDate));
            const selectedReview = shuffleForDay(
                allReviewCandidates.slice(0, MAX_DAILY_REVIEWS),
                `${level}:review`
            );
            const reviewWords = selectedReview.map(c => {
                const full = vocab.find(v=>v.word===c.word);
                return { ...(full||{word:c.word}), _reviewCount:(c.record.reviewsCompleted||0)+1, _wordKey:c.key };
            });

            const newWordCount = DAILY_WORD_GOAL - reviewWords.length;
            const newWords = [];
            const usedWords = new Set(Object.entries(data.wordRecords).filter(([key])=>key.startsWith(level+'::')).map(([,record])=>record.word));
            reviewWords.forEach(rw=>usedWords.add(rw.word));
            const shuffledVocab = shuffleForDay(vocab, `${level}:new-pool`);
            let idx = data.newWordIndex, attempts=0;
            while(newWords.length < newWordCount && attempts < shuffledVocab.length*2) {
                const item = shuffledVocab[idx % shuffledVocab.length];
                if(!usedWords.has(item.word) && !newWords.find(nw=>nw.word===item.word)) {
                    newWords.push({...item, _isNew:true}); usedWords.add(item.word);
                }
                idx++; attempts++;
            }
            data.newWordIndex = shuffledVocab.length ? idx % shuffledVocab.length : 0;
            const storyResult = generateStory([...newWords, ...reviewWords], level);
            const dailyEntry = {
                level,
                newWords: shuffleForDay(newWords, `${level}:new-display`),
                reviewWords,
                story: storyResult.storyEn, storyCn: storyResult.storyCn,
                storyVersion: STORY_VERSION,
                responses: {},
                markedDone: false, generatedAt: new Date().toISOString()
            };
            data.dailyWords[dayKey] = dailyEntry;
            for(const nw of newWords) {
                const wKey = getWordKey(level, nw.word);
                if(!data.wordRecords[wKey]) {
                    data.wordRecords[wKey] = { word:nw.word, learnDate:today, dueDate:today, stability:1, lapseCount:0, reviewSchedule:[], reviewsCompleted:0, lastReviewedDate:null, mastered:false };
                }
            }
            saveData(data);
            return dailyEntry;
        }

        function extractChineseMeaning(meaning) {
            return meaning.replace(/^(n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|int\.)\s*/, '').split(/[；;，,]/)[0].trim();
        }

        function generateStory(words, level) {
            const allWords = words.map(w=>w.word);
            const curated = CURATED_STORIES[level];
            let selectedStoryEn = curated?.en || '';
            let selectedStoryCn = curated?.cn || '';
            if (curated && allWords.length) {
                const enSentences = curated.en.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [curated.en];
                const cnSentences = curated.cn.match(/[^。！？]+[。！？]+|[^。！？]+$/g) || [curated.cn];
                const selectedIndexes = enSentences.map((sentence,index)=>
                    allWords.some(word=>new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(sentence)) ? index : -1
                ).filter(index=>index>=0);
                if(selectedIndexes.length) {
                    selectedStoryEn = selectedIndexes.map(index=>enSentences[index].trim()).join(' ');
                    if(cnSentences.length === enSentences.length) selectedStoryCn = selectedIndexes.map(index=>cnSentences[index].trim()).join('');
                }
            }
            const coveredWords = curated
                ? allWords.filter(w=>new RegExp(`\\b${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`, 'i').test(selectedStoryEn))
                : [];
            let storyEn = selectedStoryEn || 'Today I followed a clear learning path and connected each new word with a concrete situation.';
            let storyCn = selectedStoryCn || '今天，我沿着一条清晰的学习路径，把每个新词都与具体情境联系起来。';

            // 新增词尚未写入定制故事时，使用词典例句承接，保证语法和词义正确。
            const uncovered = words.filter(w=>!coveredWords.includes(w.word));
            if (uncovered.length) {
                storyEn += ' ' + uncovered.map(w=>w.example || `I learned how to use the word “${w.word}” in context.`).join(' ');
                storyCn += ' ' + uncovered.map(w=>w.exampleCn || `我结合语境学习了“${w.word}”这个词。`).join('');
            }

            const highlightEN = (text, words) => {
                let res=text; [...words].sort((a,b)=>b.length-a.length).forEach(w=>{
                    const regex=new RegExp(`\\b(${w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`,'gi');
                    res=res.replace(regex,'<span class="story-word">$1</span>');
                }); return res;
            };
            const highlightCN = (text, words) => {
                let res=text; words.forEach(w=>{
                    const meanings=(w.meaning||'').replace(/^(n\.|v\.|adj\.|adv\.|prep\.|conj\.|pron\.|int\.)\s*/, '').split(/[；;，,]/).map(s=>s.trim()).filter(s=>s.length>=2);
                    meanings.forEach(cn=>{
                        const regex=new RegExp(`(${cn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})`,'g');
                        res=res.replace(regex,'<span class="story-word-cn">$1</span>');
                    });
                }); return res;
            };
            return { storyEn: highlightEN(storyEn,allWords), storyCn: highlightCN(storyCn,words) };
        }

        function highlightExample(example, word) {
            if(!example) return '';
            return example.replace(new RegExp(`\\b(${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')})\\b`,'gi'), '<span class="highlight">$1</span>');
        }

        function showToast(msg, duration=2000) {
            const toast=document.getElementById('toast'); toast.textContent=msg; toast.classList.add('show');
            clearTimeout(toast._timeout); toast._timeout=setTimeout(()=>toast.classList.remove('show'), duration);
        }

        function getPunchDaysCount() {
            return new Set(Object.entries(appData.dailyWords).filter(([,entry])=>entry.markedDone).map(([key])=>key.split('::')[0])).size;
        }

        function renderWordCard(wordData, type, dailyEntry) {
            const answered = dailyEntry.responses?.[wordData.word];
            const isReview = type === 'review';
            return `
                <div class="word-card ${isReview?'review-word':'new-word'} ${answered?'is-answered':''}" data-card-word="${wordData.word}">
                    <span class="tag ${isReview?'review-tag':'new-tag'}">${isReview?`🔄 复习 · 第${wordData._reviewCount||1}次`:'🆕 新词'}</span>
                    <div class="word-row">
                        <span class="word">${wordData.word}</span><span class="phonetic">${wordData.phonetic||''}</span>
                        <button class="word-tool-btn" data-action="speak" data-word="${wordData.word}" aria-label="朗读 ${wordData.word}">🔊</button>
                        <button class="word-tool-btn" data-action="spell" data-word="${wordData.word}" data-meaning="${extractChineseMeaning(wordData.meaning||'')}">✍️ 拼写</button>
                    </div>
                    ${answered ? `<div class="answer-mark">✅ 已作答：${answered==='again'?'不认识':answered==='hard'?'模糊':'认识'}</div>` : `<button class="recall-btn" data-action="reveal" data-word="${wordData.word}">👁️ 显示答案</button>`}
                    <div class="recall-content ${answered?'':'is-hidden'}">
                        <div class="meaning">📝 ${wordData.meaning}</div>
                        ${wordData.example ? `<div class="example">💬 ${highlightExample(wordData.example, wordData.word)}<br><small>${wordData.exampleCn||''}</small></div>` : ''}
                        ${answered ? '' : `<div class="recall-actions">
                            <button class="rating-btn" data-action="rate" data-rating="again" data-word="${wordData.word}">😵 不认识</button>
                            <button class="rating-btn" data-action="rate" data-rating="hard" data-word="${wordData.word}">🤔 模糊</button>
                            <button class="rating-btn" data-action="rate" data-rating="good" data-word="${wordData.word}">😊 认识</button>
                        </div>`}
                    </div>
                    <button class="master-btn" data-action="master" data-word="${wordData.word}" data-type="${type}">⭐ 掌握</button>
                </div>`;
        }

        function renderAll() {
            const level = appData.level;
            document.querySelectorAll('.level-btn').forEach(b=>b.classList.toggle('active', b.dataset.level===level));
            const d=new Date(); const days=['日','一','二','三','四','五','六'];
            document.getElementById('dateDisplay').textContent = `📅 ${TODAY} 星期${days[d.getDay()]} | 词库: ${level.toUpperCase()}`;

            const dailyEntry = getTodayWords(appData, level);
            const newWords = dailyEntry.newWords || [];
            const reviewWords = dailyEntry.reviewWords || [];
            document.getElementById('newCount').textContent = newWords.length;
            document.getElementById('reviewCount').textContent = reviewWords.length;
            document.getElementById('newSectionCount').textContent = newWords.length;
            document.getElementById('reviewSectionCount').textContent = reviewWords.length;
            document.getElementById('totalLearned').textContent = Object.keys(appData.wordRecords).filter(k=>k.startsWith(level+'::')).length;
            const totalToday = newWords.length + reviewWords.length;
            const todayWordSet = new Set([...newWords,...reviewWords].map(w=>w.word));
            const answeredCount = Object.keys(dailyEntry.responses||{}).filter(word=>todayWordSet.has(word)).length;
            const pct = totalToday ? Math.round((answeredCount/totalToday)*100) : 0;
            document.getElementById('progressFill').style.width = pct+'%';
            document.getElementById('progressLabel').textContent = dailyEntry.markedDone ? `✅ 今日已完成 ${answeredCount}/${totalToday}` : `今日作答: ${answeredCount}/${totalToday} 词`;
            document.getElementById('punchDays').textContent = getPunchDaysCount();

            const newContainer = document.getElementById('newWordsContainer');
            newContainer.innerHTML = newWords.length ? newWords.map(w=>renderWordCard(w,'new',dailyEntry)).join('') : '<div class="empty-state">🎉 今日新词已学完</div>';

            const reviewContainer = document.getElementById('reviewWordsContainer');
            reviewContainer.innerHTML = reviewWords.length ? reviewWords.map(w=>renderWordCard(w,'review',dailyEntry)).join('') : '<div class="empty-state">📭 今日无复习单词</div>';

            document.getElementById('storyContainer').innerHTML = dailyEntry.story ? `
                <div class="story-card">
                    <h3>📖 今日巩固故事</h3>
                    <div class="story-en">${dailyEntry.story}</div>
                    <hr class="divider">
                    <h3>🇨🇳 中文翻译</h3>
                    <div class="story-cn">${dailyEntry.storyCn}</div>
                </div>` : '<div class="empty-state">📝 故事生成中...</div>';
        }

        // 单词卡片交互：先主动回忆，再根据熟悉程度安排下一次复习。
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('[data-action]');
            if(!btn) return;
            const action = btn.dataset.action;
            const word = btn.dataset.word;
            const level = appData.level;
            const dayKey = getDailyKey();
            const dailyEntry = appData.dailyWords[dayKey];

            if(action === 'reveal') {
                const card = btn.closest('.word-card');
                card?.querySelector('.recall-content')?.classList.remove('is-hidden');
                btn.remove();
                return;
            }
            if(action === 'speak') {
                if(!('speechSynthesis' in window)) return showToast('当前浏览器不支持语音朗读');
                speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US'; utterance.rate = 0.82;
                speechSynthesis.speak(utterance);
                return;
            }
            if(action === 'spell') {
                const answer = prompt(`请拼写“${btn.dataset.meaning}”对应的英文单词：`);
                if(answer === null) return;
                if(answer.trim().toLowerCase() === word.toLowerCase()) showToast('✅ 拼写正确');
                else showToast(`❌ 正确答案：${word}`, 3500);
                return;
            }
            if(!dailyEntry || !word) return;

            const wKey = getWordKey(level, word);
            const record = appData.wordRecords[wKey] || (appData.wordRecords[wKey] = {
                word, learnDate:TODAY, dueDate:TODAY, stability:1, lapseCount:0,
                reviewSchedule:[], reviewsCompleted:0, lastReviewedDate:null, mastered:false
            });

            if(action === 'rate') {
                if(dailyEntry.responses?.[word]) return showToast('这个单词今天已经作答');
                const rating = btn.dataset.rating;
                const interval = scheduleByRating(record, rating);
                dailyEntry.responses = dailyEntry.responses || {};
                dailyEntry.responses[word] = rating;
                saveData(appData); renderAll();
                showToast(`✅ 已记录，${interval}天后复习`);
                return;
            }

            if(action === 'master') {
                record.mastered = true;
                record.lastReviewedDate = TODAY;
                record.dueDate = null;
                dailyEntry.responses = dailyEntry.responses || {};
                dailyEntry.responses[word] = dailyEntry.responses[word] || 'good';
                saveData(appData); renderAll();
                showToast(`⭐ “${word}” 已标记为掌握`);
            }
        });

        document.getElementById('levelSelector').addEventListener('click', e => {
            const btn = e.target.closest('.level-btn');
            if(!btn) return;
            const newLevel = btn.dataset.level;
            if(newLevel !== appData.level) {
                appData.level = newLevel;
                saveData(appData);
                renderAll();
                showToast(`✅ 已切换到${newLevel.toUpperCase()}`);
            }
        });
        document.getElementById('btnRefresh').addEventListener('click', ()=>{
            const dayKey = getDailyKey();
            const old = appData.dailyWords[dayKey];
            if(old && Object.keys(old.responses||{}).length) return showToast('已有作答记录，今日内容不能刷新', 3000);
            if(old?.newWords) old.newWords.forEach(nw=>{
                if(!old.responses?.[nw.word]) delete appData.wordRecords[getWordKey(appData.level,nw.word)];
            });
            delete appData.dailyWords[dayKey];
            saveData(appData); renderAll(); showToast('🔄 已刷新');
        });
        document.getElementById('btnPunch').addEventListener('click', ()=>{
            const dailyEntry = appData.dailyWords[getDailyKey()];
            if(!dailyEntry) return showToast('请先生成单词');
            if(dailyEntry.markedDone) return showToast('今日已打卡');
            const words = [...(dailyEntry.newWords||[]),...(dailyEntry.reviewWords||[])];
            const answered = words.filter(w=>dailyEntry.responses?.[w.word]).length;
            if(words.length && answered < words.length) return showToast(`还需完成 ${words.length-answered} 个单词`, 3000);
            dailyEntry.markedDone = true;
            saveData(appData); renderAll();
            showToast('📌 打卡成功！累计 '+getPunchDaysCount()+' 天');
        });
        document.getElementById('btnExport').addEventListener('click', ()=>{
            const payload = JSON.stringify({ exportedAt:new Date().toISOString(), app:'艾宾浩斯背单词', data:appData }, null, 2);
            const url = URL.createObjectURL(new Blob([payload], {type:'application/json'}));
            const link = document.createElement('a');
            link.href=url; link.download=`背单词学习数据-${TODAY}.json`; link.click();
            setTimeout(()=>URL.revokeObjectURL(url), 1000);
            showToast('⬇️ 学习数据已导出');
        });
        document.getElementById('btnImport').addEventListener('click', ()=>document.getElementById('importFile').click());
        document.getElementById('importFile').addEventListener('change', event=>{
            const file = event.target.files?.[0];
            if(!file) return;
            const reader = new FileReader();
            reader.onload = ()=>{
                try {
                    const parsed = JSON.parse(reader.result);
                    const imported = parsed.data || parsed;
                    if(!imported || typeof imported !== 'object' || !imported.wordRecords || !imported.dailyWords) throw new Error('invalid');
                    if(!confirm('导入会覆盖当前学习进度，确定继续吗？')) return;
                    appData = migrateData(imported); saveData(appData); renderAll(); showToast('✅ 学习数据导入成功');
                } catch(error) { showToast('⚠️ 文件格式不正确', 3000); }
                event.target.value='';
            };
            reader.readAsText(file, 'utf-8');
        });
        document.getElementById('btnReset').addEventListener('click', ()=>{
            if(confirm('确定重置所有进度吗？')) {
                appData = getDefaultData(); saveData(appData); renderAll(); showToast('🗑️ 已重置');
            }
        });

        function init() {
            renderAll();
            localStorage.setItem('eibbinghaus_last_check', TODAY);
        }
        init();
    })();
</script>
